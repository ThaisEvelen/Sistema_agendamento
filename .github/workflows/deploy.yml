name: Deploy Flutter Web → GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Baixa o código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instala o Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      # 3. Gera ícones placeholder (PNG roxo simples via Python)
      - name: Generate placeholder icons
        run: |
          python3 - <<'EOF'
          import struct, zlib, os

          def make_png(size, color=(124, 58, 237, 255)):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              raw = b''.join(b'\x00' + bytes(color[:3]) * size for _ in range(size))
              idat = zlib.compress(raw)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')

          os.makedirs('web/icons', exist_ok=True)
          for sz in [192, 512]:
              data = make_png(sz)
              open(f'web/icons/Icon-{sz}.png', 'wb').write(data)
              open(f'web/icons/Icon-maskable-{sz}.png', 'wb').write(data)
          open('web/favicon.png', 'wb').write(make_png(16))
          print('Icons created.')
          EOF

      # 4. Instala dependências
      - name: Install dependencies
        run: flutter pub get

      # 5. Build web
      - name: Build web
        run: flutter build web --release --base-href /Sistema_agendamento/

      # 6. Publica no branch gh-pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build/web
          branch: gh-pages
          clean: true
