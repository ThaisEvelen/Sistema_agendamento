name: Deploy Flutter Web → GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Baixa o código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instala o Flutter (último stable)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Instala dependências
      - name: Install dependencies
        run: flutter pub get

      # 4. Habilita suporte a Web e gera a pasta web/ corretamente
      - name: Enable Flutter Web
        run: flutter create --platforms=web .

      # 5. Build web
      - name: Build web
        run: flutter build web --release --base-href /Sistema_agendamento/

      # 6. Publica no branch gh-pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build/web
          branch: gh-pages
          clean: true
